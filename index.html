<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noor Path - Premium Islamic Super App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #00D4AA;
            --neon-emerald: #00ff88;
            --dark-bg: #0a0f1a;
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --gold-accent: #FFD700;
            --dark-card: rgba(10, 15, 26, 0.8);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Cairo', sans-serif;
            background: linear-gradient(135deg, var(--dark-bg) 0%, #1a1f2e 50%, #16213e 100%);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
        }

        /* Glassmorphism Effect */
        .glassmorphism {
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.3), 
                        0 0 0 1px rgba(255, 255, 255, 0.05),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
        }

        /* Splash Screen */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, var(--dark-bg), var(--primary-green));
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeOut 3s forwards;
        }

        .splash-content {
            text-align: center;
            animation: float 2s ease-in-out infinite;
        }

        .noor-logo {
            font-size: 3.5rem;
            background: linear-gradient(45deg, var(--neon-emerald), var(--gold-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .splash-subtitle {
            font-size: 1.2rem;
            color: rgba(255, 255, 255, 0.8);
            font-weight: 300;
        }

        /* Auth Screen */
        .auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, var(--dark-bg), #1a1f2e);
            z-index: 999;
        }

        .auth-container {
            width: 100%;
            max-width: 400px;
            padding: 2rem;
        }

        .auth-card {
            padding: 2.5rem;
            text-align: center;
            max-width: 400px;
            margin: 0 auto;
        }

        .auth-card h2 {
            font-size: 1.8rem;
            margin-bottom: 2rem;
            background: linear-gradient(45deg, var(--neon-emerald), var(--gold-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .input-group {
            margin-bottom: 2rem;
        }

        .input-group input {
            width: 100%;
            padding: 1rem 1.5rem;
            margin-bottom: 1rem;
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            color: var(--text-primary);
            font-size: 1rem;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .input-group input::placeholder {
            color: var(--text-secondary);
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--neon-emerald);
            box-shadow: 0 0 0 3px rgba(0, 212, 170, 0.1);
        }

        /* Premium Button */
        .premium-btn {
            width: 100%;
            padding: 1.2rem 2rem;
            background: linear-gradient(45deg, var(--neon-emerald), var(--primary-green));
            border: none;
            border-radius: 20px;
            color: var(--dark-bg);
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(0, 212, 170, 0.4);
        }

        .premium-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(0, 212, 170, 0.6);
        }

        .premium-btn:active {
            transform: translateY(-1px);
        }

        .premium-btn.loading {
            pointer-events: none;
        }

        .premium-btn .spinner {
            display: none;
            border: 2px solid rgba(255,255,255,0.3);
            border-top: 2px solid var(--dark-bg);
            border-radius: 50%;
            width: 20px;
            height: 20px;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        .premium-btn.loading .spinner {
            display: inline-block;
        }

        /* Google Sign-In */
        .google-signin {
            margin-top: 1.5rem;
            background: rgba(255, 255, 255, 0.1);
            color: var(--text-primary);
            border: 1px solid rgba(255, 255, 255, 0.2);
        }

        .google-signin:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--neon-emerald);
        }

        /* Main App */
        .main-app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Premium Header */
        .app-header {
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-icon {
            font-size: 2rem;
            background: linear-gradient(45deg, var(--neon-emerald), var(--gold-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title {
            font-size: 1.5rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--neon-emerald), var(--gold-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Personalized Greeting */
        .personalized-header {
            text-align: center;
            padding: 2rem;
            background: linear-gradient(135deg, rgba(0, 212, 170, 0.1), rgba(255, 215, 0, 0.1));
            border-radius: 24px;
            margin: 1rem 2rem;
            animation: slideInDown 0.8s ease-out;
        }

        .admin-title {
            font-size: 1.1rem;
            color: var(--gold-accent);
            font-weight: 600;
            margin-bottom: 0.5rem;
            animation: glow 2s ease-in-out infinite alternate;
        }

        .greeting-text {
            font-size: 1.6rem;
            font-weight: 600;
            background: linear-gradient(45deg, var(--neon-emerald), var(--text-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: fadeInUp 1s ease-out 0.2s both;
        }

        /* Animations */
        @keyframes fadeOut {
            to { opacity: 0; visibility: hidden; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        @keyframes glow {
            from { filter: drop-shadow(0 0 10px var(--neon-emerald)); }
            to { filter: drop-shadow(0 0 20px var(--neon-emerald)); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        @keyframes slideInDown {
            from { transform: translateY(-50px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        @keyframes fadeInUp {
            from { transform: translateY(30px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }

        .hidden { display: none !important; }
        .active { display: block; }

        /* Responsive */
        @media (max-width: 768px) {
            .noor-logo { font-size: 2.5rem; }
            .greeting-text { font-size: 1.3rem; }
            .app-header { padding: 1rem; }
        }
    </style>
</head>
<body>
    <!-- Splash Screen -->
    <div id="splashScreen" class="splash-screen">
        <div class="splash-content">
            <div class="noor-logo">
                <i class="fas fa-moon-stars"></i> Noor Path
            </div>
            <p class="splash-subtitle">Premium Islamic Super App</p>
        </div>
    </div>

    <!-- Login/Register -->
    <div id="authScreen" class="auth-screen">
        <div class="auth-container">
            <div class="auth-card glassmorphism">
                <h2><i class="fas fa-user-plus"></i> Welcome to Noor Path</h2>
                <div class="input-group">
                    <input type="text" id="userName" placeholder="Enter your name">
                    <input type="email" id="userEmail" placeholder="Enter your email">
                </div>
                <button id="loginBtn" class="premium-btn">
                    <span class="spinner"></span>
                    <i class="fas fa-arrow-right"></i> Enter Noor Path
                </button>
                <button id="googleSignIn" class="premium-btn google-signin">
                    <i class="fab fa-google"></i> Continue with Google
                </button>
                <p class="auth-note" style="margin-top: 1.5rem; color: var(--text-secondary); font-size: 0.9rem;">
                    Secure • Private • Local Storage
                </p>
            </div>
        </div>
    </div>

    <!-- Main App -->
    <div id="mainApp" class="main-app hidden">
        <!-- Premium Personalized Header -->
        <div class="personalized-header glassmorphism">
            <div class="admin-title" id="adminTitle">Admin Hamza</div>
            <div class="greeting-text" id="greetingText">Assalamualaikum User</div>
        </div>

        <!-- Header -->
        <header class="app-header glassmorphism">
            <div class="header-left">
                <i class="fas fa-moon-stars header-icon"></i>
                <h1 class="header-title">Noor Path AI</h1>
            </div>
            <div class="header-right">
                <button id="notificationsBtn" class="header-btn" style="background: none; border: none; color: var(--text-primary); font-size: 1.2rem; cursor: pointer;">
                    <i class="fas fa-bell"></i>
                    <span id="notifBadge" class="badge hidden" style="background: var(--neon-emerald); color: var(--dark-bg); border-radius: 10px; padding: 2px 6px; font-size: 0.8rem;">3</span>
                </button>
                <button id="profileBtn" class="header-btn" style="background: none; border: none; color: var(--text-primary); font-size: 1.2rem; cursor: pointer;">
                    <i class="fas fa-user"></i>
                </button>
            </div>
        </header>

        <!-- Dashboard Content -->
        <main id="appContent">
            <!-- Home Dashboard -->
            <section id="homeDashboard" class="dashboard active" style="padding: 2rem;">
                <div style="text-align: center; margin-bottom: 2rem;">
                    <h2 style="font-size: 2rem; background: linear-gradient(45deg, var(--neon-emerald), var(--gold-accent)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">
                        Your Daily Deen Journey
                    </h2>
                </div>
                <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 1.5rem; margin-bottom: 2rem;">
                    <div class="glassmorphism stat-card" style="padding: 1.5rem; text-align: center; cursor: pointer; transition: all 0.3s ease;">
                        <i class="fas fa-hands-praying" style="font-size: 2rem; color: var(--neon-emerald); margin-bottom: 0.5rem;"></i>
                        <h3 style="font-size: 1.5rem; margin: 0.5rem 0;">0</h3>
                        <p>Today's Tasbeeh</p>
                    </div>
                    <div class="glassmorphism stat-card" style="padding: 1.5rem; text-align: center; cursor: pointer; transition: all 0.3s ease;">
                        <i class="fas fa-mosque" style="font-size: 2rem; color: var(--gold-accent); margin-bottom: 0.5rem;"></i>
                        <h3 style="font-size: 1.5rem; margin: 0.5rem 0;">Fajr</h3>
                        <p>Next Prayer</p>
                    </div>
                    <div class="glassmorphism stat-card" style="padding: 1.5rem; text-align: center; cursor: pointer; transition: all 0.3s ease;">
                        <i class="fas fa-book-open" style="font-size: 2rem; color: var(--primary-green); margin-bottom: 0.5rem;"></i>
                        <h3 style="font-size: 1.5rem; margin: 0.5rem 0;">0</h3>
                        <p>Ayahs Today</p>
                    </div>
                    <div class="glassmorphism stat-card" style="padding: 1.5rem; text-align: center; cursor: pointer; transition: all 0.3s ease;">
                        <i class="fas fa-star" style="font-size: 2rem; color: var(--gold-accent); margin-bottom: 0.5rem;"></i>
                        <h3 style="font-size: 1.5rem; margin: 0.5rem 0;">0</h3>
                        <p>Deen XP</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script>
        // Firebase Configuration (Noor Path Firebase)
        const firebaseConfig = {
            apiKey: "AIzaSyCu7t0Dx0xiX-WiITzmsIM-TlKXC32X8BQ",
            authDomain: "noor-path-226ce.firebaseapp.com",
            projectId: "noor-path-226ce",
            storageBucket: "noor-path-226ce.firebasestorage.app",
            messagingSenderId: "616816872871",
            appId: "1:616816872871:web:12e3a6fae3e230e1203a82",
            measurementId: "G-NYY9XZRRL5"
        };

        // App State
        let currentUser = null;
        let userData = JSON.parse(localStorage.getItem('noorPathUser')) || {};

        // DOM Elements
        const splashScreen = document.getElementById('splashScreen');
        const authScreen = document.getElementById('authScreen');
        const mainApp = document.getElementById('mainApp');
        const loginBtn = document.getElementById('loginBtn');
        const googleSignIn = document.getElementById('googleSignIn');
        const userNameInput = document.getElementById('userName');
        const userEmailInput = document.getElementById('userEmail');
        const adminTitle = document.getElementById('adminTitle');
        const greetingText = document.getElementById('greetingText');

        // Initialize App
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                splashScreen.style.display = 'none';
                if (userData.name) {
                    showMainApp(userData);
                } else {
                    authScreen.classList.remove('hidden');
                }
            }, 3000);

            // Event Listeners
            loginBtn.addEventListener('click', handleManualLogin);
            googleSignIn.addEventListener('click', handleGoogleSignIn);
        });

        // Manual Login
        function handleManualLogin() {
            const name = userNameInput.value.trim();
            const email = userEmailInput.value.trim();

            if (!name || !email) {
                alert('Please enter your name and email');
                return;
            }

            loginBtn.innerHTML = '<span class="spinner"></span><i class="fas fa-spinner fa-spin"></i> Entering Noor Path...';
            loginBtn.classList.add('loading');

            // Save to localStorage
            userData = { name, email, timestamp: Date.now() };
            localStorage.setItem('noorPathUser', JSON.stringify(userData));

            setTimeout(() => {
                showMainApp(userData);
            }, 1500);
        }

        // Google Sign-In (Firebase Auth)
        async function handleGoogleSignIn() {
            try {
                // Load Firebase SDK dynamically
                const { initializeApp } = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js');
                const { getAuth, GoogleAuthProvider, signInWithPopup } = await import('https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js');

                const app = initializeApp(firebaseConfig);
                const auth = getAuth(app);
                const provider = new GoogleAuthProvider();

                googleSignIn.innerHTML = '<span class="spinner"></span><i class="fas fa-spinner fa-spin"></i> Signing in...';
                googleSignIn.classList.add('loading');

                const result = await signInWithPopup(auth, provider);
                const user = result.user;

                userData = {
                    name: user.displayName || user.email.split('@')[0],
                    email: user.email,
                    photoURL: user.photoURL,
                    uid: user.uid,
                    timestamp: Date.now()
                };

                localStorage.setItem('noorPathUser', JSON.stringify(userData));
                showMainApp(userData);

            } catch (error) {
                console.error('Google Sign-In Error:', error);
                alert('Google Sign-In failed. Using manual login as backup.');
                googleSignIn.innerHTML = '<i class="fab fa-google"></i> Continue with Google';
                googleSignIn.classList.remove('loading');
            }
        }

        // Show Main App
        function showMainApp(user) {
            currentUser = user;
            authScreen.classList.add('hidden');
            mainApp.classList.remove('hidden');

            // Update personalized greeting
            adminTitle.textContent = 'Admin Hamza';
            greetingText.textContent = `Assalamualaikum ${user.name}`;
            
            // Smooth entrance animation
            mainApp.style.animation = 'slideInDown 0.8s ease-out';
        }

        // Auto-detect existing user on page load
        if (userData.name) {
            currentUser = userData;
            document.addEventListener('DOMContentLoaded', () => {
                setTimeout(() => {
                    showMainApp(userData);
                }, 1000);
            });
        }
    </script>
</body>
</html>
