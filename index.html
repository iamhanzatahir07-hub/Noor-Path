<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noor Path | Supreme Admin HAMZA</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        :root {
            --primary: #004d3d;
            --secondary: #002e25;
            --gold: #d4af37;
            --light-gold: #f4dfa2;
            --text-white: #ffffff;
            --bg-dark: #050a0e;
            --card-bg: #0a1612;
            --transition: all 0.3s ease;
        }

        body {
            background-color: var(--bg-dark);
            color: var(--text-white);
            font-family: 'Poppins', sans-serif;
            margin: 0;
            overflow-x: hidden;
            padding-bottom: 90px;
        }

        /* --- Login Screen --- */
        #login-screen {
            position: fixed;
            inset: 0;
            background: linear-gradient(rgba(0,0,0,0.7), rgba(0,0,0,0.7)), url('https://images.unsplash.com/photo-1591604129939-f1efa4d9f7fa?ixlib=rb-4.0.3&auto=format&fit=crop&w=1000&q=80');
            background-size: cover;
            background-position: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 9999;
            text-align: center;
        }

        .login-card {
            background: rgba(0, 77, 61, 0.85);
            backdrop-filter: blur(10px);
            padding: 40px;
            border-radius: 30px;
            border: 2px solid var(--gold);
            box-shadow: 0 15px 35px rgba(0,0,0,0.5);
            width: 80%;
            max-width: 350px;
        }

        .login-btn {
            background: white;
            color: #333;
            padding: 15px 25px;
            border-radius: 50px;
            border: none;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            margin-top: 20px;
            transition: var(--transition);
        }

        /* --- Dashboard Header --- */
        .header {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            padding: 40px 25px;
            border-bottom: 4px solid var(--gold);
            border-radius: 0 0 50px 50px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        .admin-badge {
            background: var(--gold);
            color: black;
            font-size: 10px;
            font-weight: bold;
            padding: 4px 12px;
            border-radius: 20px;
            display: inline-block;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        /* --- Content Sections --- */
        .container { padding: 20px; max-width: 600px; margin: auto; }

        .feature-card {
            background: var(--card-bg);
            border-radius: 25px;
            padding: 25px;
            margin-bottom: 20px;
            border: 1px solid rgba(212, 175, 55, 0.1);
            transition: var(--transition);
        }

        .feature-card:hover { transform: translateY(-5px); border-color: var(--gold); }

        /* --- Tasbeeh Design --- */
        .tasbeeh-display {
            font-size: 60px;
            font-weight: 700;
            color: var(--gold);
            text-shadow: 0 0 15px rgba(212, 175, 55, 0.4);
            margin: 20px 0;
        }

        .circle-btn {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            border: 8px solid var(--gold);
            margin: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: active 0.1s;
            box-shadow: 0 0 20px rgba(212,175,55,0.2);
        }

        .circle-btn:active { transform: scale(0.95); background: rgba(212, 175, 55, 0.1); }

        /* --- Navigation Bar --- */
        .bottom-nav {
            position: fixed;
            bottom: 20px;
            left: 20px;
            right: 20px;
            background: rgba(0, 46, 37, 0.95);
            backdrop-filter: blur(15px);
            display: flex;
            justify-content: space-around;
            padding: 20px;
            border-radius: 30px;
            border: 2px solid var(--gold);
            box-shadow: 0 5px 25px rgba(0,0,0,0.6);
        }

        .nav-item { color: rgba(255,255,255,0.5); font-size: 24px; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: var(--gold); transform: translateY(-5px); }

        /* --- Quran Quote --- */
        .quran-box { font-family: 'Amiri', serif; font-size: 20px; color: var(--light-gold); line-height: 1.8; padding: 15px; }

    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <i class="fa-solid fa-kaaba" style="font-size: 70px; color: var(--gold); margin-bottom: 15px;"></i>
            <h1 style="margin: 0; letter-spacing: 2px;">NOOR PATH</h1>
            <p style="color: var(--light-gold); font-size: 14px;">The Ultimate Islamic Portal</p>
            <button class="login-btn" onclick="signIn()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20">
                Login with Admin Account
            </button>
        </div>
    </div>

    <div id="app" style="display:none;">
        <header class="header">
            <span class="admin-badge">SUPREME ADMIN ACCESS</span>
            <h2 style="margin: 0;">Assalam-o-Alaikum, <br><span id="u-name" style="color:var(--gold)">Hamza Tahir</span></h2>
        </header>

        <div class="container">
            <div class="feature-card" style="text-align: center;">
                <h1 id="main-clock" style="font-size: 50px; margin: 0; color: var(--gold);">00:00:00</h1>
                <p id="main-date" style="margin: 5px 0; font-weight: 600;"></p>
                <div id="hijri-box" style="color: var(--light-gold); font-size: 14px;">Loading Hijri Date...</div>
            </div>

            <div class="feature-card" style="text-align: center;">
                <h3 style="margin: 0;"><i class="fa-solid fa-dharmachakra"></i> Digital Tasbeeh</h3>
                <div class="tasbeeh-display" id="t-count">0</div>
                <div class="circle-btn" onclick="addTasbeeh()">
                    <i class="fa-solid fa-fingerprint" style="font-size: 40px; color: var(--gold);"></i>
                </div>
                <button onclick="resetT()" style="background:none; border: 1px solid var(--gold); color: var(--gold); padding: 8px 20px; border-radius: 10px; margin-top: 20px; cursor: pointer;">Reset Counter</button>
            </div>

            <div class="feature-card" style="text-align: center;">
                <i class="fa-solid fa-book-open" style="color: var(--gold);"></i>
                <div class="quran-box">
                    "فَإِنَّ مَعَ الْعُسْرِ يُسْرًا" <br>
                    <small style="font-family: 'Poppins'; font-size: 14px;">So verily, with every difficulty, there is ease. (94:5)</small>
                </div>
            </div>
        </div>

        <nav class="bottom-nav">
            <i class="fa-solid fa-mosque nav-item active"></i>
            <i class="fa-solid fa-book-quran nav-item"></i>
            <i class="fa-solid fa-compass nav-item"></i>
            <i class="fa-solid fa-gears nav-item"></i>
            <i class="fa-solid fa-power-off nav-item" onclick="signOutHamza()" style="color: #ff4d4d;"></i>
        </nav>
    </div>

<script>
    // Firebase Config (Derived from your file)
    const firebaseConfig = {
      apiKey: "AIzaSyCu7t0Dx0xiX-WIiTzm8IM-V8uD5C1_1_Y",
      authDomain: "noor-path-226ce.firebaseapp.com",
      projectId: "noor-path-226ce",
      storageBucket: "noor-path-226ce.appspot.com",
      messagingSenderId: "616816872871",
      appId: "1:616816872871:web:12e3a6fae3c230e1203a82"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Login System
    function signIn() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider).catch(e => alert("Access Denied: " + e.message));
    }

    function signOutHamza() {
        auth.signOut().then(() => location.reload());
    }

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            document.getElementById('u-name').innerText = user.displayName;
        }
    });

    // Real-time Systems
    setInterval(() => {
        const now = new Date();
        document.getElementById('main-clock').innerText = now.toLocaleTimeString();
        document.getElementById('main-date').innerText = now.toDateString();
    }, 1000);

    // Tasbeeh Logic
    let count = 0;
    function addTasbeeh() {
        count++;
        document.getElementById('t-count').innerText = count;
        if(navigator.vibrate) navigator.vibrate(40);
    }
    function resetT() {
        count = 0;
        document.getElementById('t-count').innerText = 0;
    }

    // Hijri Date Mockup
    const hijriMonths = ["Muharram", "Safar", "Rabi' al-awwal", "Rabi' ath-thani", "Jumada al-ula", "Jumada al-akhira", "Rajab", "Sha'ban", "Ramadan", "Shawwal", "Dhu al-Qi'dah", "Dhu al-Hijjah"];
    document.getElementById('hijri-box').innerText = "14 Zilhajj 1447 AH"; 

</script>
</body>
</html>
