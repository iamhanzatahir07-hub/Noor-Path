<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Noor Path Ultimate | Supreme Admin</title>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-auth-compat.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Amiri&family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #004d3d; --accent: #d4af37; --bg: #010406;
            --glass: rgba(255, 255, 255, 0.02); --gold-glow: rgba(212, 175, 55, 0.3);
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        body { background: var(--bg); color: white; font-family: 'Plus Jakarta Sans', sans-serif; margin: 0; overflow-x: hidden; }

        /* --- Ultimate Background Animation --- */
        .bg-animate {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: radial-gradient(circle at 50% 50%, #002e25 0%, #010406 100%);
            z-index: -1; overflow: hidden;
        }
        .bg-animate span {
            position: absolute; display: block; width: 20px; height: 20px;
            background: var(--accent); opacity: 0.1; border-radius: 50%;
            animation: move 25s infinite linear;
        }

        @keyframes move {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            50% { opacity: 0.2; }
            100% { transform: translateY(-1000px) rotate(720deg); opacity: 0; }
        }

        /* --- Login Section (Big Level) --- */
        #login-screen {
            position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 9999;
            backdrop-filter: blur(10px);
        }
        .login-card {
            background: rgba(0, 0, 0, 0.7); padding: 60px 40px; border-radius: 50px;
            border: 1px solid var(--gold-glow); text-align: center; width: 90%; max-width: 450px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5); animation: zoomIn 0.6s ease;
        }
        .kaaba-box {
            width: 120px; height: 120px; background: var(--accent); border-radius: 35px;
            margin: 0 auto 30px; display: flex; align-items: center; justify-content: center;
            box-shadow: 0 0 40px var(--gold-glow); animation: float 3s infinite ease-in-out;
        }
        .kaaba-box i { font-size: 55px; color: black; }

        .google-btn {
            background: #fff; color: #000; padding: 20px; border-radius: 25px;
            border: none; font-weight: 800; cursor: pointer; display: flex;
            align-items: center; justify-content: center; gap: 15px; width: 100%;
            margin-top: 40px; font-size: 17px; box-shadow: 0 10px 20px rgba(255,255,255,0.1);
        }
        .google-btn:hover { transform: scale(1.02); box-shadow: 0 15px 30px rgba(212,175,55,0.2); }

        /* --- Main Dashboard UI --- */
        .app-container { display: none; padding: 25px; animation: fadeIn 1s ease; }
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        .user-pill {
            background: var(--glass); border: 1px solid var(--gold-glow);
            padding: 8px 20px; border-radius: 50px; display: flex; align-items: center; gap: 12px;
        }
        .user-pill img { width: 35px; height: 35px; border-radius: 50%; border: 2px solid var(--accent); }

        /* Tasbeeh Ultimate Wheel */
        .tasbeeh-card {
            background: var(--glass); border-radius: 45px; padding: 40px;
            text-align: center; border: 1px solid rgba(255,255,255,0.05); position: relative;
        }
        .progress-ring {
            width: 220px; height: 220px; margin: 0 auto; position: relative;
            display: flex; align-items: center; justify-content: center;
        }
        .progress-ring svg { position: absolute; transform: rotate(-90deg); }
        .progress-ring circle {
            fill: none; stroke-width: 8; stroke-linecap: round;
            stroke: var(--accent); stroke-dasharray: 628; stroke-dashoffset: 628;
            transition: stroke-dashoffset 0.3s;
        }
        .count-val { font-size: 70px; font-weight: 800; color: #fff; text-shadow: 0 0 20px var(--gold-glow); }

        /* Floating Nav */
        .nav-dock {
            position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
            width: 90%; max-width: 420px; height: 85px; background: rgba(0,0,0,0.8);
            backdrop-filter: blur(25px); border-radius: 35px; border: 1px solid rgba(255,255,255,0.1);
            display: flex; justify-content: space-around; align-items: center;
        }
        .nav-dock i { font-size: 26px; color: #555; cursor: pointer; }
        .nav-dock i.active { color: var(--accent); filter: drop-shadow(0 0 8px var(--accent)); }

        /* Animations */
        @keyframes float { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-15px); } }
        @keyframes zoomIn { from { opacity: 0; transform: scale(0.8); } to { opacity: 1; transform: scale(1); } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

    </style>
</head>
<body>

    <div class="bg-animate" id="bg-stars"></div>

    <div id="login-screen">
        <div class="login-card">
            <div class="kaaba-box"><i class="fa-solid fa-kaaba"></i></div>
            <h1 style="margin:0; font-size: 38px; letter-spacing: 6px; font-weight: 800;">NOOR PATH</h1>
            <p style="color: var(--accent); letter-spacing: 2px; font-size: 12px; margin-top: 10px;">SUPREME ISLAMIC PORTAL</p>
            
            <button class="google-btn" onclick="signIn()">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="25">
                Sign in with Google
            </button>
        </div>
    </div>

    <div class="app-container" id="app">
        <div class="header">
            <div>
                <small style="color: var(--accent); font-weight: 800;">AL-SALAMU ALAYKUM</small>
                <h2 style="margin: 5px 0 0;" id="user-name">Hamza Tahir</h2>
            </div>
            <div class="user-pill">
                <img id="user-img" src="" alt="">
                <i class="fa-solid fa-crown" style="color: var(--accent); font-size: 14px;"></i>
            </div>
        </div>

        <div class="tasbeeh-card" onclick="doTasbeeh()">
            <div class="progress-ring">
                <svg width="220" height="220">
                    <circle cx="110" cy="110" r="100" id="ring"></circle>
                </svg>
                <div class="count-val" id="counter">0</div>
            </div>
            <p id="zikr-text" style="color: var(--accent); margin-top: 20px; font-weight: 600; letter-spacing: 3px;">SUBHANALLAH</p>
            <button onclick="event.stopPropagation(); resetC()" style="background:none; border:none; color:#444; font-size:12px; margin-top:10px;">TAP TO RESET</button>
        </div>

        <div style="margin-top: 30px; padding: 25px; background: var(--glass); border-radius: 35px; border-left: 5px solid var(--accent);">
            <p style="font-family: 'Amiri', serif; font-size: 26px; color: var(--accent); line-height: 1.8; margin: 0;">فَإِنَّ مَعَ الْعُسْرِ يُسْرًا</p>
            <p style="font-size: 14px; opacity: 0.6; margin-top: 15px;">"For indeed, with hardship [will be] ease." (94:5)</p>
        </div>

        <div class="nav-dock">
            <i class="fa-solid fa-house-chimney active"></i>
            <i class="fa-solid fa-book-quran"></i>
            <i class="fa-solid fa-compass"></i>
            <i class="fa-solid fa-power-off" onclick="logout()" style="color: #ff4d4d;"></i>
        </div>
    </div>

<script>
    const firebaseConfig = {
      apiKey: "AIzaSyCu7t0Dx0xiX-WIiTzm8IM-V8uD5C1_1_Y",
      authDomain: "noor-path-226ce.firebaseapp.com",
      projectId: "noor-path-226ce",
      storageBucket: "noor-path-226ce.appspot.com",
      messagingSenderId: "616816872871",
      appId: "1:616816872871:web:12e3a6fae3c230e1203a82"
    };

    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();

    // Create Background Stars
    const bg = document.getElementById('bg-stars');
    for(let i=0; i<20; i++){
        let span = document.createElement('span');
        span.style.left = Math.random() * 100 + '%';
        span.style.top = Math.random() * 100 + '%';
        span.style.animationDelay = Math.random() * 20 + 's';
        bg.appendChild(span);
    }

    function signIn() {
        const provider = new firebase.auth.GoogleAuthProvider();
        auth.signInWithPopup(provider);
    }

    function logout() { auth.signOut().then(() => location.reload()); }

    auth.onAuthStateChanged(user => {
        if (user) {
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app').style.display = 'block';
            document.getElementById('user-name').innerText = user.displayName;
            document.getElementById('user-img').src = user.photoURL;
        }
    });

    let count = 0;
    const ring = document.getElementById('ring');
    function doTasbeeh() {
        count++;
        document.getElementById('counter').innerText = count;
        if(navigator.vibrate) navigator.vibrate(60);
        
        let offset = 628 - (count % 33) * (628 / 33);
        ring.style.strokeDashoffset = offset;

        if(count % 33 == 0) {
            navigator.vibrate([100, 50, 100]);
            changeZikr();
        }
    }

    function resetC() { count = 0; document.getElementById('counter').innerText = 0; ring.style.strokeDashoffset = 628; }

    const zikrs = ["SUBHANALLAH", "ALHAMDULILLAH", "ALLAHU AKBAR"];
    let zIndex = 0;
    function changeZikr() {
        zIndex = (zIndex + 1) % zikrs.length;
        document.getElementById('zikr-text').innerText = zikrs[zIndex];
    }
</script>
</body>
</html>
