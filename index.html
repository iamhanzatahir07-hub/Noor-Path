<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Noor Path - Premium Islamic Super App</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Cairo:wght@400;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary-green: #00D4AA;
            --neon-emerald: #00ff88;
            --neon-cyan: #00d9ff;
            --dark-bg: #0a0f1a;
            --dark-gradient: linear-gradient(135deg, #0a0f1a 0%, #1a1f2e 50%, #16213e 100%);
            --glass-bg: rgba(255, 255, 255, 0.05);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text-primary: #ffffff;
            --text-secondary: #b0b0b0;
            --gold-accent: #FFD700;
            --shadow-glow: 0 25px 45px rgba(0, 212, 170, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Poppins', 'Cairo', 'Inter', sans-serif;
            background: var(--dark-gradient);
            color: var(--text-primary);
            overflow-x: hidden;
            min-height: 100vh;
            position: relative;
        }

        /* Animated Islamic Particles */
        .particles {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 1;
        }

        .particle {
            position: absolute;
            background: radial-gradient(circle, var(--neon-emerald) 0%, transparent 70%);
            border-radius: 50%;
            animation: float 6s ease-in-out infinite;
        }

        /* Glassmorphism */
        .glassmorphism {
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: var(--shadow-glow), 
                        0 0 0 1px rgba(255, 255, 255, 0.05),
                        inset 0 1px 0 rgba(255, 255, 255, 0.1);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .glassmorphism:hover {
            transform: translateY(-8px);
            box-shadow: 0 35px 60px rgba(0, 212, 170, 0.4),
                        0 0 0 1px rgba(0, 212, 170, 0.2);
        }

        /* Splash Screen */
        .splash-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            background: linear-gradient(135deg, var(--dark-bg), var(--primary-green));
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            animation: fadeOut 4s forwards;
        }

        .noor-logo {
            font-size: clamp(2.5rem, 8vw, 4rem);
            font-weight: 800;
            background: linear-gradient(45deg, var(--neon-emerald), var(--gold-accent), var(--neon-cyan));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 1rem;
            animation: glowPulse 2s ease-in-out infinite alternate;
            text-shadow: 0 0 30px rgba(0, 212, 170, 0.5);
        }

        .splash-subtitle {
            font-size: clamp(1rem, 3vw, 1.3rem);
            color: rgba(255, 255, 255, 0.9);
            font-weight: 400;
            letter-spacing: 2px;
        }

        /* Auth Screen */
        .auth-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
            background: var(--dark-gradient);
        }

        .auth-container {
            width: 100%;
            max-width: 420px;
            padding: 2rem 1rem;
        }

        .auth-card {
            padding: 3rem 2.5rem;
            text-align: center;
            max-width: 420px;
            margin: 0 auto;
        }

        /* Premium Buttons */
        .premium-btn {
            width: 100%;
            padding: 1.3rem 2rem;
            background: linear-gradient(45deg, var(--neon-emerald), var(--primary-green));
            border: none;
            border-radius: 20px;
            color: #0a0f1a;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 15px 35px rgba(0, 212, 170, 0.4);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.8rem;
        }

        .premium-btn:hover {
            transform: translateY(-4px) scale(1.02);
            box-shadow: 0 25px 50px rgba(0, 212, 170, 0.6);
        }

        .premium-btn:active {
            transform: translateY(-2px) scale(1.01);
        }

        .premium-btn.loading {
            pointer-events: none;
        }

        .spinner {
            width: 20px;
            height: 20px;
            border: 2px solid rgba(10, 15, 26, 0.3);
            border-top: 2px solid #0a0f1a;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        /* Main App */
        .main-app {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            position: relative;
            z-index: 10;
        }

        /* Premium Personalized Header */
        .personalized-header {
            padding: 2rem 2.5rem;
            background: linear-gradient(135deg, rgba(0, 212, 170, 0.15), rgba(255, 215, 0, 0.1));
            border-radius: 0 0 24px 24px;
            margin: 0 1rem;
            margin-top: -1rem;
            animation: slideInDown 1s cubic-bezier(0.4, 0, 0.2, 1);
            border-bottom: 1px solid rgba(0, 212, 170, 0.2);
        }

        .admin-title {
            font-size: 1rem;
            color: var(--gold-accent);
            font-weight: 700;
            margin-bottom: 0.3rem;
            animation: shimmer 2s linear infinite;
            font-family: 'Cairo', sans-serif;
        }

        .greeting-text {
            font-size: clamp(1.4rem, 4vw, 1.8rem);
            font-weight: 700;
            background: linear-gradient(45deg, var(--neon-emerald), var(--neon-cyan), var(--text-primary));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            animation: fadeInUp 1.2s ease-out 0.3s both;
            font-family: 'Cairo', sans-serif;
        }

        /* App Header */
        .app-header {
            padding: 1.2rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(20px);
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-icon {
            font-size: 2.2rem;
            background: linear-gradient(45deg, var(--neon-emerald), var(--gold-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .header-title {
            font-size: 1.6rem;
            font-weight: 700;
            background: linear-gradient(45deg, var(--neon-emerald), var(--gold-accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Dashboard */
        .dashboard {
            padding: 2rem 1.5rem;
            flex: 1;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 1.5rem;
            margin: 2rem 0;
        }

        .stat-card {
            padding: 2rem 1.5rem;
            text-align: center;
            cursor: pointer;
            position: relative;
            overflow: hidden;
        }

        .stat-card i {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            display: block;
        }

        .stat-card h3 {
            font-size: 2rem;
            font-weight: 700;
            margin: 0.5rem 0;
        }

        /* Bottom Navigation */
        .bottom-nav {
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-around;
            background: var(--glass-bg);
            backdrop-filter: blur(20px);
            border-top: 1px solid var(--glass-border);
            position: sticky;
            bottom: 0;
            z-index: 100;
        }

        .nav-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            font-size: 1.4rem;
            padding: 0.8rem;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-btn.active {
            color: var(--neon-emerald);
            background: rgba(0, 212, 170, 0.2);
            transform: scale(1.1);
        }

        .nav-btn:hover {
            color: var(--neon-emerald);
            transform: scale(1.05);
        }

        /* Hidden Class */
        .hidden { display: none !important; }
        .active { display: block; }

        /* Animations */
        @keyframes fadeOut { to { opacity: 0; visibility: hidden; } }
        @keyframes float {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            33% { transform: translateY(-20px) rotate(120deg); }
            66% { transform: translateY(-10px) rotate(240deg); }
        }
        @keyframes glowPulse {
            0% { filter: drop-shadow(0 0 20px var(--neon-emerald)); }
            100% { filter: drop-shadow(0 0 40px var(--neon-emerald)); }
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @keyframes slideInDown {
            from { transform: translateY(-60px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes fadeInUp {
            from { transform: translateY(40px); opacity: 0; }
            to { transform: translateY(0); opacity: 1; }
        }
        @keyframes shimmer {
            0% { background-position: -200% 0; }
            100% { background-position: 200% 0; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .stats-grid { grid-template-columns: repeat(2, 1fr); }
            .personalized-header { padding: 1.5rem; margin: 0 0.5rem; }
        }
    </style>
</head>
<body>

    <!-- Splash Screen -->

        </div>

                </div>
                <button id="loginBtn" class="premium-btn">
                    <span class="spinner" style="display: none;"></span>

        </div>

        <!-- App Header -->
        <header class="app-header glassmorphism">

                </button>
                <button id="profileBtn" style="background: none; border: none; color: var(--text-secondary); font-size: 1.3rem; cursor: pointer; padding: 0.5rem;">
                    <i class="fas fa-user"></i>

        </header>

        <!-- Main Content -->
        <main id="appContent">

            <section id="homeDashboard" class="dashboard active">

                <div class="glassmorphism" style="padding: 1.5rem; margin-bottom: 2rem; text-align: center;">

                <div class="stats-grid">

                    <div class="glassmorphism stat-card" data-section="xp">
                        <i class="fas fa-star" style="color: var(--gold-accent);"></i>
                        <h3 id="userXP">1250</h3>
                        <p>Deen XP</p>
                        <div style="font-size: 0.9rem; color: var(--text-secondary);">Level 7</div>

                    </button>
                    <button class="glassmorphism premium-btn" style="padding: 1.5rem; font-size: 1rem; height: auto; min-height: 70px;" data-section="qibla">
                        <i class="fas fa-compass" style="font-size: 1.5rem;"></i><br>Qibla
                    </button>
                </div>
            </section>
        </main>

        <!-- Floating Bottom Navigation -->
        <nav class="bottom-nav glassmorphism">
            <button class="nav-btn active" data-section="homeDashboard" title="Home">
                <i class="fas fa-home"></i>
            </button>
            <button class="nav-btn" data-section="prayer" title="Prayer">
                <i class="fas fa-mosque"></i>
            </button>
